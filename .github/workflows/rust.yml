name: Test and deploy Ragzin

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ragzin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang mold pkg-config libssl-dev
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ragzin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Validate installer
        run: |
          python3 -m unittest discover -s deploy/tests -v
          bash -n deploy/package.sh deploy/ragzin-backup
      - name: Unit tests
        env:
          DATABASE_PASSWORD: unused-test-password
        run: |
          cp config.template.json config.json
          cargo test --locked --release --package configuration
          cargo test --locked --release --package server --bin server
      - name: Build optimized server
        run: cargo build --locked --release --package server --bin server
      - name: Package release
        env:
          REVISION: ${{ github.sha }}
        run: bash deploy/package.sh "$REVISION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ragzin-${{ github.sha }}
          path: dist/ragzin-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy:
    name: Deploy to Lightsail
    needs: build
    # Never execute PRs or forks on the production runner.
    if: >-
      github.repository == 'nellysbr/rust-ro' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, Linux, X64, ragzin]
    timeout-minutes: 10
    concurrency:
      group: ragzin-production
      cancel-in-progress: false
    steps:
      # No checkout or repository scripts execute on the production host.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ragzin-${{ github.sha }}
          path: /srv/ragzin/incoming
      - name: Install, backup and restart
        env:
          REVISION: ${{ github.sha }}
        run: sudo -n /usr/local/sbin/ragzin-deploy "$REVISION"
